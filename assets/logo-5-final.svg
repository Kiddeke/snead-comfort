<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 335" width="560" height="335" role="img" aria-label="Snead Comfort Solutions logo">
  <!-- Final mark, per Wesley: wide diamond, lime green + blue, italic SCS monogram -->
  <g fill="none">
    <polygon points="280,7 545,155 280,303 15,155" stroke="#1B5CA8" stroke-width="5"/>
    <polygon points="280,18 526,155 280,292 34,155" stroke="#8CC63F" stroke-width="14"/>
    <polygon points="280,31 504,155 280,279 56,155" stroke="#1B5CA8" stroke-width="4.5"/>
  </g>
  <rect x="258" y="258" width="44" height="34" fill="#FFFFFF"/>
  <g font-family="'Poppins','Segoe UI',sans-serif" text-anchor="middle">
    <g font-weight="800" font-size="96" transform="translate(26.8,0) skewX(-10)">
      <text x="280" y="152" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linejoin="round" textLength="260" lengthAdjust="spacingAndGlyphs">SCS</text>
      <text x="280" y="152" fill="none" stroke="#8CC63F" stroke-width="10" stroke-linejoin="round" textLength="260" lengthAdjust="spacingAndGlyphs">SCS</text>
      <text x="280" y="152" fill="#1B5CA8" textLength="260" lengthAdjust="spacingAndGlyphs">SCS</text>
    </g>
    <g font-weight="700" font-size="42">
      <text x="280" y="200" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linejoin="round" textLength="368" lengthAdjust="spacingAndGlyphs">SNEAD COMFORT</text>
      <text x="280" y="200" fill="#8CC63F" textLength="368" lengthAdjust="spacingAndGlyphs">SNEAD COMFORT</text>
    </g>
    <g font-weight="700" font-size="33" letter-spacing="6">
      <text x="280" y="235" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linejoin="round" textLength="240" lengthAdjust="spacingAndGlyphs">SOLUTIONS</text>
      <text x="280" y="235" fill="#1B5CA8" textLength="240" lengthAdjust="spacingAndGlyphs">SOLUTIONS</text>
    </g>
    <g font-weight="700" font-size="30" letter-spacing="3">
      <text x="280" y="286" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"><tspan>HVAC</tspan><tspan dx="10">SERVICES</tspan></text>
      <text x="280" y="286"><tspan fill="#1B5CA8">HVAC</tspan><tspan dx="10" fill="#8CC63F">SERVICES</tspan></text>
