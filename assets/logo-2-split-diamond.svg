  <text x="130" y="276" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-weight="600" font-size="27" letter-spacing="4" fill="#142A3B" textLength="210" lengthAdjust="spacingAndGlyphs">SNEAD COMFORT</text>
  <text x="130" y="302" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-weight="500" font-size="19" letter-spacing="7" fill="#2B6E9E" textLength="150" lengthAdjust="spacingAndGlyphs">SOLUTIONS</text>
