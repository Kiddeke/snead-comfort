<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" width="260" height="300" role="img" aria-label="Snead Comfort Solutions diamond monogram logo">
  <!-- Concept 1: Wesley's original idea, refined — a double-stroked diamond with SCS -->
  <g fill="none" stroke-linejoin="miter">
    <polygon points="130,14 246,120 130,226 14,120" stroke="#142A3B" stroke-width="4"/>
    <polygon points="130,32 226,120 130,208 34,120" stroke="#142A3B" stroke-width="12"/>
  </g>
  <circle cx="130" cy="14" r="7" fill="#E8622C"/>
  <circle cx="130" cy="226" r="7" fill="#2B6E9E"/>
  <text x="130" y="140" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-weight="700" font-size="64" letter-spacing="2" fill="#142A3B">SCS</text>
  <text x="130" y="262" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-weight="600" font-size="26" letter-spacing="4" fill="#142A3B" textLength="210" lengthAdjust="spacingAndGlyphs">SNEAD COMFORT</text>
  <text x="130" y="288" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-weight="500" font-size="19" letter-spacing="7" fill="#E8622C" textLength="150" lengthAdjust="spacingAndGlyphs">SOLUTIONS</text>
</svg>
